<!DOCTYPE html>
<html lang="pt-BR">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon.ico">
 <script src="https://cdn.tailwindcss.com"></script>

 <title>Recuperação de senha</title>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center">
 <div class="w-full max-w-md px-6">
  <div class="bg-slate-800 rounded-2xl shadow-xl p-8">
   <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">
     Esqueceu a senha?
    </h1>
    <p class="text-slate-400 mt-2">
     Informe seu email para recuperar
    </p>
   </div>

   <form id="recuperarSenhaForm" class="space-y-5">

    <div>
     <label class="block text-slate-300 mb-2">
      E-mail
     </label>

     <input type="email" id="email" placeholder="Digite seu e-mail" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500">
    </div>



    <button id="btnRecuperarSenha" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95">

     <span id="btnText">
      Recuperar senha
     </span>

     <svg id="btnSpinner" class="hidden animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
      </circle>

      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z">
      </path>
     </svg>

    </button>
   </form>
  </div>
 </div>
 </div>
 <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3"></div>


 <script type="module" src="assets/js/pages/recuperaSenha.js"></script>

</body>


</html>
