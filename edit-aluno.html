<!DOCTYPE html>
<html lang="pt-br">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
 <script src="https://cdn.tailwindcss.com"></script>

 <title>Editar Aluno</title>
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

 <form id="registerForm" class="w-full max-w-2xl">

  <div class="bg-slate-800/95 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl p-6">

   <!-- Logo -->
   <div class="flex justify-center mb-4">
    <img src="./assets/images/logo.png" alt="Logo" class="w-20 h-20 object-contain">
   </div>

   <!-- Título -->
   <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-white">
     Ficha do aluno
    </h1>

    <p class="text-slate-400 mt-2">
     Atualize os dados do seu aluno
    </p>
   </div>

   <!-- Campos -->
   <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Nome -->
    <div class="md:col-span-2">
     <label class="block text-slate-300 mb-2">
      Nome Completo
     </label>

     <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
    </div>

    <!-- Email -->
    <div>
     <label class="block text-slate-300 mb-2">
      E-mail
     </label>

     <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
    </div>

    <!-- Faixa -->
    <div>
     <label class="block text-slate-300 mb-2">
      Faixa Atual
     </label>

     <select id="faixa" name="faixa" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

      <option value="branca">Branca</option>
      <option value="azul">Azul</option>
      <option value="roxa">Roxa</option>
      <option value="marrom">Marrom</option>
      <option value="preta">Preta</option>
     </select>
    </div>
    <!--Status-->
    <div>
     <label class="block text-slate-300 mb-2">
      Status
     </label>

     <select id="status" name="status" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">

      <option value="Ativa">Ativa</option>
      <option value="Inativa">Inativa</option>

     </select>
    </div>
    <!-- Celular -->
    <div>
     <label class="block text-slate-300 mb-2">
      Celular
     </label>

     <input type="tel" id="celular" name="celular" required placeholder="(12) 99999-9999" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
    </div>

    <!-- Data Nascimento -->
    <div>
     <label class="block text-slate-300 mb-2">
      Data de Nascimento
     </label>

     <input type="date" id="dataNasc" name="dataNasc" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
    </div>

    <!-- Data matricula -->
    <div>
     <label class="block text-slate-300 mb-2">
      Data de Matrícula
     </label>

     <input type="text" id="dataMatricula" readonly class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white">
    </div>

   </div>

   <!-- Botão -->
   <div class="mt-6 flex justify-center">
    <button id="btnAtualizaCadastroAluno" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95">

     <span id="btnText">
      Atualizar cadastro
     </span>

     <svg id="btnSpinner" class="hidden animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
      </circle>

      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z">
      </path>

     </svg>

    </button>
   </div>


   <div class="text-center mt-4">
    <a href="dashboard-professor.html" class="text-blue-400 hover:text-blue-300 text-sm">
     Voltar
    </a>
   </div>

  </div>
  <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3">
  </div>
 </form>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script type="module" src="assets/js/pages/edit-aluno.js"></script>
</body>

</html>
