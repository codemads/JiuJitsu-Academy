<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia de Jiu-Jitsu</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md px-6">

    <div class="bg-slate-800 rounded-2xl shadow-xl p-8">

      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white">
          Academia
        </h1>

        <p class="text-slate-400 mt-2">
          Sistema de Gestão de Alunos
        </p>
      </div>

      <form id="loginForm" class="space-y-5">

        <div>
          <label class="block text-slate-300 mb-2">
            E-mail
          </label>

          <input type="email" id="email" placeholder="Digite seu e-mail" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-slate-300 mb-2">
            Senha
          </label>

          <input type="password" id="senha" placeholder="Digite sua senha" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white outline-none focus:border-blue-500">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
          Entrar
        </button>

      </form>

      <div class="mt-6 text-center">

        <p class="text-slate-400">
          Não possui conta?
        </p>

        <a href="cadastro.html" class="text-blue-400 hover:text-blue-300 font-medium">
          Criar cadastro
        </a>

      </div>

    </div>

  </div>

  <script src="./js/login.js"></script>

</body>

</html>
